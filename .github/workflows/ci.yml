# ci.yml — CI pipeline (card E1.2; extended E2.1).
#
# Required checks (branch protection targets these job names, E1.3):
#   lint              ruff over product surfaces (scope pinned in pyproject.toml)
#   tests             pytest (backend) + frontend build (tsc --noEmit + vite build)
#   migration-lint    forward-only SQL migration gate (scripts/migration_lint.py)
#   contract-sync     Zod<->pydantic single contract (ADR 0003) drift gate
#   gitleaks          secrets never in git — full-history scan (fetch-depth: 0)
#   db-tests          migrations apply clean on empty DB + pgtap invariants +
#                     grants regression (scripts/db_tests.py, E2.1)
#   supabase-security supabase db lint zero-ERROR + get_advisors gate (E2.1)
#
# Rules encoded here (docs/build/README.md "Hard rules"):
#   - secrets never in git/chat: gitleaks is a required job, no credentials in
#     this workflow beyond the ephemeral GITHUB_TOKEN checkout needs (read-only)
#   - done = verified: every job runs the real script/test suite, no stubs

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny-default: nothing beyond reading the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend (dev)
        run: pip install -e '.[dev]'

      - name: ruff check
        run: ruff check .

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend (dev)
        run: pip install -e '.[dev]'

      - name: pytest
        run: pytest

      - name: npm ci
        run: npm ci

      # frontend build = tsc --noEmit && vite build (frontend/package.json),
      # so typecheck rides along with the build.
      - name: frontend build
        run: npm run build

  migration-lint:
    name: migration-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: migration lint (db/migrations)
        run: python3 scripts/migration_lint.py

  contract-sync:
    name: contract-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend
        run: pip install -e .

      - name: contract drift check (pydantic -> zod mirror)
        run: python3 scripts/contract_sync.py --check

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: secrets never in git means never in ANY commit.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks detect (full history + tree)
        run: gitleaks detect --source . --redact --no-banner -v

  # E2.1: migrations apply clean on an empty Supabase Postgres (the real target
  # image), then pgtap schema invariants + deny-default grants regression.
  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    services:
      db:
        # Pinned Supabase Postgres — same extension set as the managed target
        # (pg_partman, pgaudit, pgtap available).
        image: public.ecr.aws/supabase/postgres:17.6.1.063
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: apply migrations + pgtap suites (invariants, grants regression)
        run: >-
          python3 scripts/db_tests.py
          --db-url "postgresql://postgres:ci-only@localhost:5432/postgres?sslmode=disable"

  # E2.1: supabase linter zero-ERROR on our schema + the get_advisors gate
  # (runs for real the moment the hosted app Postgres is provisioned and
  # SUPABASE_ACCESS_TOKEN / GAMMASUMMIT_SUPABASE_PROJECT_REF secrets exist).
  supabase-security:
    name: supabase-security
    runs-on: ubuntu-latest
    services:
      db:
        image: public.ecr.aws/supabase/postgres:17.6.1.063
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.95.4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: apply migrations (empty DB)
        run: >-
          python3 scripts/db_tests.py --apply-only
          --db-url "postgresql://postgres:ci-only@localhost:5432/postgres?sslmode=disable"

      - name: supabase db lint (zero ERROR, our schema)
        env:
          PGSSLMODE: disable
        run: >-
          supabase db lint
          --db-url "postgresql://postgres:ci-only@localhost:5432/postgres"
          -s public --level error --fail-on error

      - name: get_advisors gate (no-op until hosted project provisioned)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GAMMASUMMIT_SUPABASE_PROJECT_REF: ${{ secrets.GAMMASUMMIT_SUPABASE_PROJECT_REF }}
        run: python3 scripts/security_advisors_check.py
